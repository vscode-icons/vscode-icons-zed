name: Sync Icons from vscode-icons

on:
  repository_dispatch:
    types: [icons-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync icons and icon theme manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vscode-icons-zed
        uses: actions/checkout@v4

      - name: Checkout vscode-icons
        uses: actions/checkout@v4
        with:
          repository: vscode-icons/vscode-icons
          path: vendor/vscode-icons

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.15.1'

      - name: Install dependencies
        working-directory: vendor/vscode-icons
        run: npm ci

      - name: Build icon manifests
        working-directory: vendor/vscode-icons
        run: npm run build:dev

      - name: Sync icons
        run: rsync -a --delete vendor/vscode-icons/icons/ icons/

      - name: Sync icon theme manifest
        run: cp vendor/vscode-icons/out/src/vsicons-icon-theme-zed.json icon_themes/vsicons-icon-theme-zed.json

      - name: Read source version
        id: version
        run: echo "version=$(node -p "require('./vendor/vscode-icons/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Update extension.toml version
        run: sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" extension.toml

      - name: Clean up vendored source
        run: rm -rf vendor

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(icons): sync icons from vscode-icons v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Tag release
        if: steps.diff.outputs.changed == 'true'
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
